<svg width="100%" viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="30" y="26" font-size="15" font-weight="600" fill="#1e293b">キャッシュの中身と、読み込みが安い理由</text>

  <!-- Row 1: write -->
  <text x="30" y="56" font-size="13" font-weight="600" fill="#92400e">初回：書き込み（1.25×）</text>
  <rect x="30" y="66" width="140" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="100" y="97" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">プレフィックス</text>

  <line x1="170" y1="93" x2="196" y2="93" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="200" y="66" width="190" height="54" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="295" y="90" text-anchor="middle" font-size="13.5" font-weight="600" fill="#92400e">Prefill（全計算）</text>
  <text x="295" y="108" text-anchor="middle" font-size="11.5" fill="#b45309">高コスト</text>

  <line x1="390" y1="93" x2="416" y2="93" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="420" y="66" width="270" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="555" y="90" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">KVテンソルを保持</text>
  <text x="555" y="108" text-anchor="middle" font-size="11.5" fill="#475569">VRAM上・一時的（生テキストは保存しない）</text>

  <!-- reuse leader -->
  <path d="M555 120 L360 188" fill="none" stroke="#0d9488" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="472" y="158" font-size="12" fill="#0f766e">再利用</text>

  <!-- Row 2: read -->
  <text x="30" y="184" font-size="13" font-weight="600" fill="#0f766e">2回目・同じプレフィックス：読み込み（0.1×）</text>
  <rect x="30" y="194" width="140" height="54" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="100" y="225" text-anchor="middle" font-size="13.5" font-weight="600" fill="#115e59">同じプレフィックス</text>

  <line x1="170" y1="221" x2="196" y2="221" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="200" y="194" width="190" height="54" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="295" y="218" text-anchor="middle" font-size="13.5" font-weight="600" fill="#115e59">Prefillをスキップ</text>
  <text x="295" y="236" text-anchor="middle" font-size="11.5" fill="#0f766e">計算を再利用</text>

  <line x1="390" y1="221" x2="416" y2="221" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="420" y="194" width="270" height="54" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="555" y="218" text-anchor="middle" font-size="13.5" font-weight="600" fill="#115e59">新トークンのみ計算</text>
  <text x="555" y="236" text-anchor="middle" font-size="11.5" fill="#0f766e">ここだけ課金（10%）</text>

  <!-- note -->
  <rect x="30" y="272" width="660" height="38" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="296" font-size="12.5" fill="#334155">最も重いのは Prefill（入力全体のattention計算）。命中時はこれを飛ばすので、読み込みは10%で済む。</text>
</svg>
