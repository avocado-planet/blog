<svg width="100%" viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Registry -->
  <rect x="210" y="30" width="300" height="60" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="360" y="56" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">ツール / スキル レジストリ</text>
  <text x="360" y="76" text-anchor="middle" font-size="12.5" fill="#475569">数百のツール定義</text>

  <line x1="360" y1="90" x2="360" y2="126" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Index -->
  <rect x="260" y="130" width="200" height="60" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="360" y="156" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">インデックス</text>
  <text x="360" y="176" text-anchor="middle" font-size="12.5" fill="#1d4ed8">BM25 / ベクトル</text>

  <line x1="360" y1="190" x2="360" y2="226" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Query -->
  <rect x="40" y="232" width="170" height="56" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="125" y="265" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">ユーザークエリ</text>
  <line x1="210" y1="260" x2="256" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Retriever -->
  <rect x="260" y="230" width="200" height="60" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="360" y="256" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Retriever</text>
  <text x="360" y="276" text-anchor="middle" font-size="12.5" fill="#1d4ed8">関連ツールを検索</text>

  <line x1="360" y1="290" x2="360" y2="336" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="316" font-size="12.5" fill="#475569">top 3〜5</text>

  <!-- Inject -->
  <rect x="260" y="340" width="200" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="360" y="366" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">コンテキスト注入</text>
  <text x="360" y="386" text-anchor="middle" font-size="12.5" fill="#b45309">関連ツールのみ</text>

  <!-- Always loaded -->
  <rect x="510" y="340" width="170" height="60" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="595" y="366" text-anchor="middle" font-size="15" font-weight="600" fill="#6b21a8">常時ロード</text>
  <text x="595" y="386" text-anchor="middle" font-size="12.5" fill="#7e22ce">頻出ツール</text>
  <line x1="510" y1="370" x2="464" y2="370" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="360" y1="400" x2="360" y2="436" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ReAct -->
  <rect x="260" y="440" width="200" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="360" y="466" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">ReAct ループ</text>
  <text x="360" y="486" text-anchor="middle" font-size="12.5" fill="#b45309">推論 → 実行 → 観測</text>
</svg>
