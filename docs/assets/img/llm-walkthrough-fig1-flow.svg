<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 225" width="920" height="225" font-family="Noto Sans CJK JP, Hiragino Sans, Meiryo, sans-serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<rect width="920" height="225" fill="#ffffff"/>
<rect x="30" y="50" width="170" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
