<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#d97706" stroke-width="1.5"/></marker>
</defs>
<rect width="760" height="540" fill="#ffffff"/>
<line x1="180" y1="64" x2="180" y2="480" stroke="#94a3b8" stroke-dasharray="5 5"/>
<line x1="580" y1="64" x2="580" y2="480" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="100" y="20" width="160" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
<text x="180" y="48" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">クライアント</text>
<rect x="500" y="20" width="160" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="580" y="48" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">サーバー</text>
<text x="380" y="100" text-anchor="middle" font-size="14" fill="#334155">1. ClientHello(対応する暗号方式)</text>
<line x1="184" y1="110" x2="576" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="380" y="160" text-anchor="middle" font-size="14" fill="#334155">2. ServerHello + サーバー証明書</text>
<line x1="576" y1="170" x2="184" y2="170" stroke="#475569" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="380" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">3. CertificateRequest(クライアント証明書を要求)</text>
<line x1="576" y1="230" x2="184" y2="230" stroke="#d97706" stroke-width="2" marker-end="url(#aa)"/>
<text x="380" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">4. クライアント証明書 + 秘密鍵による署名</text>
<line x1="184" y1="290" x2="576" y2="290" stroke="#d97706" stroke-width="2" marker-end="url(#aa)"/>
<rect x="400" y="312" width="360" height="48" rx="8" fill="#fef3c7" stroke="#d97706"/>
<text x="580" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">5. サーバーがCA検証 + 署名検証</text>
<text x="380" y="400" text-anchor="middle" font-size="14" fill="#334155">6. Finished(鍵交換の完了確認)</text>
<line x1="576" y1="410" x2="184" y2="410" stroke="#475569" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="380" y="450" text-anchor="middle" font-size="14" fill="#334155">7. 暗号化されたデータ通信</text>
<line x1="184" y1="460" x2="576" y2="460" stroke="#475569" stroke-width="1.5" marker-end="url(#ag)"/>
<line x1="576" y1="460" x2="184" y2="460" stroke="#475569" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="40" y="520" font-size="13" fill="#b45309">橙色:mTLSで追加される手順(通常のHTTPSにはありません)</text>
</svg>
